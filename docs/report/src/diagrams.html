<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CloudLens diagrams</title>
<style>
body{margin:0;background:#fff;font-family:Inter,Arial,sans-serif}
.d{width:1400px;padding:24px;box-sizing:border-box}

</style></head><body>

<div class="d" id="arch">

    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <style>

    .grp{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}

    .s{font-size:13px;fill:#475569}
    .h{font-size:14px;font-weight:700;fill:#334155;letter-spacing:.06em}
    .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .lbl{font-size:12px;fill:#334155}
  </style>
  <!-- clouds -->
  <rect class="grp" x="10" y="10" width="270" height="560" rx="14"/>
  <text class="h" x="30" y="40">CLOUD PROVIDERS</text>
  <rect class="box" x="30" y="60" width="230" height="140" rx="10" style="stroke:#b45309"/>
  <text class="t" x="48" y="92" style="fill:#b45309">AWS</text>
  <text class="s" x="48" y="116">Cost Explorer (GetCostAndUsage)</text><text class="s" x="48" y="136">EC2 · RDS inventory</text><text class="s" x="48" y="156">CloudWatch GetMetricData</text><text class="s" x="48" y="176">IAM role (read-only)</text>
  <rect class="box" x="30" y="220" width="230" height="140" rx="10" style="stroke:#1d5fd6"/>
  <text class="t" x="48" y="252" style="fill:#1d5fd6">Azure</text>
  <text class="s" x="48" y="276">Cost Management Query API</text><text class="s" x="48" y="296">Resource Manager</text><text class="s" x="48" y="316">Azure Monitor metrics</text><text class="s" x="48" y="336">Service principal</text>
  <rect class="box" x="30" y="380" width="230" height="170" rx="10" style="stroke:#047857"/>
  <text class="t" x="48" y="412" style="fill:#047857">GCP</text>
  <text class="s" x="48" y="436">Cloud Billing API</text><text class="s" x="48" y="456">BigQuery billing export</text><text class="s" x="48" y="476">Cloud Monitoring</text><text class="s" x="48" y="496">Service account key</text>
  <text class="s" x="48" y="526" style="font-style:italic">or Mock generator</text><text class="s" x="48" y="544" style="font-style:italic">(DATA_SOURCE=mock)</text>

  <!-- backend -->
  <rect class="grp" x="330" y="10" width="560" height="560" rx="14"/>
  <text class="h" x="350" y="40">BACKEND CONTAINER · FastAPI (Python 3.12)</text>
  <rect class="box" x="350" y="60" width="250" height="80" rx="10"/><text class="t" x="368" y="92">APScheduler</text><text class="s" x="368" y="116">daily 02:00 · 15 min · 5 min · 60 s</text>
  <rect class="box" x="620" y="60" width="250" height="80" rx="10"/><text class="t" x="638" y="92">Provider connectors</text><text class="s" x="638" y="116">aws · azure · gcp · mock</text>
  <rect class="box" x="620" y="160" width="250" height="80" rx="10"/><text class="t" x="638" y="192">Normalizer + Ingestion</text><text class="s" x="638" y="216">unified schema · idempotent upsert</text>
  <rect class="box" x="350" y="160" width="250" height="80" rx="10"/><text class="t" x="368" y="192">Alert engine</text><text class="s" x="368" y="216">8 metric types · rule state</text>
  <rect class="box" x="350" y="260" width="250" height="80" rx="10"/><text class="t" x="368" y="292">/metrics</text><text class="s" x="368" y="316">Prometheus exposition</text>
  <rect class="box" x="620" y="260" width="250" height="80" rx="10"/><text class="t" x="638" y="292">Analytics</text><text class="s" x="638" y="316">trends · MoM · anomalies · savings</text>
  <rect class="box" x="620" y="360" width="250" height="80" rx="10"/><text class="t" x="638" y="392">REST API /api/v1</text><text class="s" x="638" y="416">JWT · RBAC (admin / viewer)</text>
  <rect class="box" x="350" y="360" width="250" height="80" rx="10"/><text class="t" x="368" y="392">Webhook receiver</text><text class="s" x="368" y="416">/alerts/webhook (bearer token)</text>
  <rect class="box" x="350" y="460" width="250" height="80" rx="10"/><text class="t" x="368" y="492">Notifier</text><text class="s" x="368" y="516">Slack Block Kit · Teams Adaptive Card</text>

  <rect class="box" x="940" y="160" width="190" height="100" rx="14" style="stroke:#334155;stroke-width:2"/>
  <text class="t" x="962" y="198">PostgreSQL 16</text><text class="s" x="962" y="222">costs · resources</text><text class="s" x="962" y="242">metrics · rules · events</text>
  <!-- frontend -->
  <rect class="box" x="940" y="360" width="190" height="100" rx="14" style="stroke:#334155;stroke-width:2"/>
  <text class="t" x="962" y="398">React dashboard</text><text class="s" x="962" y="422">nginx container</text><text class="s" x="962" y="442">dark / light · USD / INR</text>
  <rect class="box" x="1180" y="370" width="150" height="80" rx="14"/><text class="t" x="1200" y="404">Users</text><text class="s" x="1200" y="428">browser</text>

  <!-- monitoring -->
  <rect class="grp" x="330" y="600" width="1000" height="150" rx="14"/>
  <text class="h" x="350" y="630">MONITORING & NOTIFICATION</text>
  <rect class="box" x="350" y="650" width="210" height="80" rx="10"/><text class="t" x="368" y="682">Prometheus</text><text class="s" x="368" y="706">scrape 30 s · alert rules</text>
  <rect class="box" x="620" y="650" width="210" height="80" rx="10"/><text class="t" x="638" y="682">Alertmanager</text><text class="s" x="638" y="706">group · dedupe · resolve</text>
  <rect class="box" x="940" y="650" width="170" height="80" rx="10" style="stroke:#4A154B"/><text class="t" x="958" y="682" style="fill:#4A154B">Slack</text><text class="s" x="958" y="706">incoming webhook</text>
  <rect class="box" x="1140" y="650" width="170" height="80" rx="10" style="stroke:#464EB8"/><text class="t" x="1158" y="682" style="fill:#464EB8">MS Teams</text><text class="s" x="1158" y="706">workflow webhook</text>

  <!-- arrows -->
  <path class="ln" d="M745 60 V48 H300 V100 H262"/>
  <text class="lbl" x="286" y="122">fetch</text>
  <path class="ln" d="M600 100 H618"/>
  <path class="ln" d="M745 140 V158"/>
  <path class="ln" d="M870 200 H938"/>
  <path class="ln" d="M938 230 C900 260 890 300 872 300"/>
  <path class="ln" d="M745 340 V358"/>
  <path class="ln" d="M938 410 H872"/>
  <path class="ln" d="M1178 410 H1132"/>
  <path class="ln" d="M475 140 V158"/>
  <path class="ln" d="M475 240 V258"/>
  <path class="ln" d="M350 690 H340 V300 H348"/>
  <text class="lbl" x="296" y="590">scrape</text>
  <path class="ln" d="M560 690 H618"/>
  <path class="ln" d="M700 650 V600 H612 V400 H602"/>
  <text class="lbl" x="706" y="625">webhook</text>
  <path class="ln" d="M475 440 V458"/>
  <path class="ln" d="M475 540 V585 H1225 V648"/>
  <path class="ln" d="M1025 585 V648"/>
  <text class="lbl" x="880" y="578">notify</text>
</svg>
</div>

<div class="d" id="flow">
<svg viewBox="0 0 1352 300" width="1352" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <style>.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.t{font-size:16px;font-weight:700;fill:#0f172a}.s{font-size:12.5px;fill:#475569}.ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#b)}</style>
  <g>
    <rect class="box" x="10" y="90" width="190" height="120" rx="12"/><text class="t" x="26" y="122">1. Alert rule</text><text class="s" x="26" y="146">defined in the UI</text><text class="s" x="26" y="166">stored in PostgreSQL</text><text class="s" x="26" y="186">metric · scope · threshold</text>
    <rect class="box" x="235" y="90" width="190" height="120" rx="12"/><text class="t" x="251" y="122">2. Alert engine</text><text class="s" x="251" y="146">every 60 s computes</text><text class="s" x="251" y="166">value, compares, sets</text><text class="s" x="251" y="186">rule_breached gauge</text>
    <rect class="box" x="460" y="90" width="190" height="120" rx="12"/><text class="t" x="476" y="122">3. Prometheus</text><text class="s" x="476" y="146">scrapes /metrics,</text><text class="s" x="476" y="166">CloudLensRuleBreached</text><text class="s" x="476" y="186">for: 1m → firing</text>
    <rect class="box" x="685" y="90" width="190" height="120" rx="12"/><text class="t" x="701" y="122">4. Alertmanager</text><text class="s" x="701" y="146">groups, de-duplicates,</text><text class="s" x="701" y="166">repeats 4 h, resolved,</text><text class="s" x="701" y="186">infra route to Slack</text>
    <rect class="box" x="910" y="90" width="190" height="120" rx="12"/><text class="t" x="926" y="122">5. Webhook</text><text class="s" x="926" y="146">bearer token check,</text><text class="s" x="926" y="166">AlertEvent stored,</text><text class="s" x="926" y="186">channels resolved</text>
    <rect class="box" x="1135" y="40" width="200" height="100" rx="12" style="stroke:#4A154B"/><text class="t" x="1151" y="78" style="fill:#4A154B">6a. Slack</text><text class="s" x="1151" y="102">Block Kit message</text>
    <rect class="box" x="1135" y="160" width="200" height="100" rx="12" style="stroke:#464EB8"/><text class="t" x="1151" y="198" style="fill:#464EB8">6b. MS Teams</text><text class="s" x="1151" y="222">Adaptive Card</text>
    <path class="ln" d="M200 150 H233"/><path class="ln" d="M425 150 H458"/><path class="ln" d="M650 150 H683"/><path class="ln" d="M875 150 H908"/>
    <path class="ln" d="M1100 140 L1133 95"/><path class="ln" d="M1100 160 L1133 205"/>
  </g>

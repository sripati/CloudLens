server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolve upstreams at request time so nginx starts even if they are down
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 "ok"; }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # API docs (Swagger / ReDoc) served by FastAPI
    location ~ ^/(docs|redoc|openapi.json) {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # Mock Slack/Teams inbox for demos (remove this block in production)
    location /mock-inbox/ {
        set $mock http://mock-receiver:9000;
        rewrite ^/mock-inbox/(.*)$ /$1 break;
        proxy_pass $mock;
    }

    # long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

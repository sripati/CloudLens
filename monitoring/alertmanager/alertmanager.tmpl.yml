# Rendered at container start: __WEBHOOK_TOKEN__ is replaced with the value from .env (see the
# alertmanager service in docker-compose.yml). The Slack URL comes from a file the backend writes
# whenever it is saved on the Settings screen.
global:
  resolve_timeout: 5m

route:
  receiver: cloudlens-backend
  group_by: ["alertname", "rule_id", "provider"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # If the backend itself is down it cannot relay notifications, so send straight to Slack.
    - matchers: ['route="infra"']
      receiver: infra-direct
      repeat_interval: 1h

receivers:
  # Normal path: Alertmanager -> CloudLens backend webhook -> Slack / Teams (per rule / Settings).
  - name: cloudlens-backend
    webhook_configs:
      - url: http://backend:8000/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __WEBHOOK_TOKEN__

  - name: infra-direct
    slack_configs:
      - api_url_file: /shared/slack_webhook_url
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"

inhibit_rules:
  # While the backend is down, don't also fire "sync failing" noise.
  - source_matchers: ['alertname="CloudLensBackendDown"']
    target_matchers: ['alertname=~"CloudLensSync.*|CloudLensDataStale"']
